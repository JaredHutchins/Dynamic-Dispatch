# One DD container. Run from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
# Everything that must survive a restart or a rebuild is in a named volume.
services:
  dd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # The agents to include, for example DD_AGENTS="claude codex gemini" on the
        # host when building. Rebuild with --build after changing it.
        DD_AGENTS: ${DD_AGENTS:-gemini}
    restart: unless-stopped
    # Reaps agent processes that outlive their parent, as systemd does on the Pi.
    init: true
    # More than Docker's 10 seconds for DD and its agents to exit on a stop.
    stop_grace_period: 60s
    volumes:
      - dd-home:/home/dd
      - dd-checkout:/home/dd/checkout
      - dd-config:/home/dd/config
      - dd-history:/home/dd/.local/share/dynamic-dispatch
      - dd-repositories:/srv/dynamic-dispatch/repos
      - dd-stories:/srv/dynamic-dispatch/worktrees
      - dd-agent-env:/etc/dynamic-dispatch
      # Each agent's home, holding its own login where it keeps one there. An agent
      # the image doesn't include leaves its volume empty and unused.
      - dd-claude-home:/home/dd-agent
      - dd-codex-home:/home/dd-codex
      - dd-gemini-home:/home/dd-gemini
      # Optional Gemini credential, read only. The start step gives Gemini's
      # account the only readable copy. Keep the file outside the repository,
      # set DD_GEMINI_CREDENTIAL to its path, and uncomment:
      # - ${DD_GEMINI_CREDENTIAL}:/etc/dd-credentials/gemini.json:ro

volumes:
  dd-home:
  dd-checkout:
  dd-config:
  dd-history:
  dd-repositories:
  dd-stories:
  dd-agent-env:
  dd-claude-home:
  dd-codex-home:
  dd-gemini-home:
